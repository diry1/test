name: CarSpotter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
targets:
  CarSpotter:
    type: application
    platform: iOS
    sources:
      - path: CarSpotter
        excludes: [Resources]
    resources:
      - CarSpotter/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CarSpotter
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
